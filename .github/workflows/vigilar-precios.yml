# Workflow REUTILIZABLE del vigilante de precios.
# No se ejecuta aquí: lo llaman los repositorios privados de datos (WEBS, precios-perfil2...).
# Corre dentro del repositorio que lo llama: lee sus productos, comprueba precios
# y guarda los resultados en ese mismo repositorio. El código se coge de aquí.
name: Vigilar precios (reutilizable)

on:
  workflow_call:
    inputs:
      producto:
        description: "ID del producto a comprobar (vacío = todos)"
        type: string
        required: false
        default: ""
    secrets:
      NTFY_TOPIC:
        required: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar los datos (repositorio privado que llama)
        uses: actions/checkout@v4

      - name: Descargar el código (este repositorio público)
        uses: actions/checkout@v4
        with:
          repository: HoJaiRu/hojairu.github.io
          path: _codigo
          sparse-checkout: vigilante

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _codigo/vigilante/requirements.txt

      - name: Instalar librerías
        run: pip install -r _codigo/vigilante/requirements.txt

      - name: Comprobar precios
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRODUCTO: ${{ inputs.producto }}
        run: python _codigo/vigilante/vigilante.py --datos precios --producto "$PRODUCTO"

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios/datos
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "precios: comprobación $(date -u +%Y-%m-%dT%H:%MZ)"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
